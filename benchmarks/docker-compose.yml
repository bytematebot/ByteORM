services:
  postgres:
    image: postgres:17-alpine
    container_name: byteorm-bench-postgres
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "55432:5432"
    # Benchmark data is throwaway: keep it in tmpfs so disk latency does not
    # dominate the measurement, and so every run starts from a clean state.
    tmpfs:
      - /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 1s
      timeout: 3s
      retries: 30
